name: Release

# En release kan laves på to måder – begge ender med en GitHub Release med dist som zip:
#
#  1. På GitHub: Releases → "Draft a new release" → vælg et nyt tag, fx v0.3.0 → Publish.
#     Workflowen bygger og lægger zip-filen på den release, du lige har lavet.
#
#  2. Fra kommandolinjen:
#       npm version minor && git push --follow-tags
#     Workflowen bygger og opretter selv releasen.
#
# Versionen på siden tages fra tagget. Tagget skal have formen vX.Y.Z.
on:
  push:
    tags: ['v*.*.*']
  release:
    types: [published]

permissions:
  contents: write

# Laves releasen på GitHub, kan både "release" og tag-"push" udløse en kørsel.
# De køres én ad gangen for samme tag, og den sidste overskriver bare zip-filen.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Byg og udgiv
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Tagget skal have formen vX.Y.Z
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tagget '$TAG' skal have formen vX.Y.Z, fx v0.3.0."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Advar, hvis package.json har en anden version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::warning::package.json siger $VERSION, men tagget er $TAG. Siden viser $TAG. Husk at rette package.json ved lejlighed."
          fi

      - name: Installer
        run: npm ci

      - name: Typetjek
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Banerne er opdaterede
        run: |
          npm run generate
          git diff --exit-code -- src/data/puzzles.json || {
            echo "::error::src/data/puzzles.json passer ikke til generatoren. Kør 'npm run generate' og commit resultatet."
            exit 1
          }

      - name: Byg
        run: npm run build
        env:
          RELEASE_VERSION: ${{ github.ref_name }}

      - name: Pak dist som zip
        run: |
          cd dist
          zip -r "../broekkryds-$TAG.zip" .

      - name: Læg zip-filen på releasen (opret den, hvis den ikke findes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "broekkryds-$TAG.zip" --clobber
          else
            gh release create "$TAG" "broekkryds-$TAG.zip" \
              --title "Brøkkryds $TAG" \
              --generate-notes \
              --verify-tag
          fi
